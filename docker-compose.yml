# Deux conteneurs : le service (jamais exposé directement) et Caddy, le portier https.
# UNE SEULE INSTANCE du service : deux instances se volent la session WhatsApp.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    # Pas de « ports » ici : seul Caddy parle au service, par le réseau interne de Docker.

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
